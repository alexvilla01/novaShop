name: deploy
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SSH: ${{ secrets.SSH_HOST != '' }}
    steps:
      - name: Deploy omitido (falta VPS o secrets)
        if: env.HAS_SSH != 'true'
        run: |
          echo "::notice::Deploy omitido: configura SSH_HOST/SSH_USER/SSH_KEY/PROJECT_DIR y el VPS."

      - name: Deploy por SSH (git reset + rebuild)
        if: env.HAS_SSH == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROJECT_DIR }}
            git fetch origin main --tags
            if [[ "${{ github.ref_name }}" == v* ]]; then
              git reset --hard "${{ github.ref_name }}"
            else
              git reset --hard origin/main
            fi
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build backend web
            docker image prune -f
